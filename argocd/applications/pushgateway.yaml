apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pushgateway
  namespace: infra-tools
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-pushgateway
    targetRevision: 3.6.1
    helm:
      releaseName: pushgateway
      valuesObject:
        fullnameOverride: pushgateway
        service:
          type: ClusterIP
          port: 9091
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: monitoring
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
